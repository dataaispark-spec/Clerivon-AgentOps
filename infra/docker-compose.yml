services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      LOGISTICS_TRACKING_MAX_AGE_HOURS: "6"
      APPROVAL_TTL_MINUTES: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
